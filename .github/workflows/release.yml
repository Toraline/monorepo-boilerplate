# Releases the boilerplate: publishes create-toraline-monorepo and
# update-toraline-monorepo to the public npm registry, and creates the git tag
# of the boilerplate version (vX.Y.Z).
#
# It runs ONLY when a person starts it by hand: GitHub > Actions > "Release" >
# "Run workflow", with the branch main. It never runs on a push, on a tag or on
# a GitHub release. The steps for a person are in docs/releasing.md.
#
# With the box "publish" off (the default) it builds, tests and packs the two
# packages, and publishes nothing and creates no tag.
#
# What the owner sets up once, in the repository settings on GitHub:
#   Settings > Secrets and variables > Actions > New repository secret
#   Name: NPM_PUBLISH_TOKEN
#   Value: an npm access token that may publish the two packages.
# Without that secret a real publish stops at its first step, with a message
# that names the secret. No token is in any file of this repository.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release. It must be the version in boilerplate/VERSION, for example 0.1.0"
        required: true
        type: string
      publish:
        description: "Publish for real: send the two packages to npm and create the git tag. When this is off, the run only builds, tests and packs."
        required: true
        type: boolean
        default: false

# Two runs never release at the same time.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  # "write" lets the run create the git tag of the release. Nothing else is written.
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ inputs.version }}
      PACKAGES: create-toraline-monorepo update-toraline-monorepo
    steps:
      - name: Stop when the branch is not main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::The boilerplate is released only from the branch main. This run uses ${GITHUB_REF}. Start the workflow again and choose the branch main."
          exit 1

      - name: Stop when the npm token is missing
        if: inputs.publish
        env:
          NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: |
          if [ -z "${NPM_PUBLISH_TOKEN}" ]; then
            echo "::error::The repository secret NPM_PUBLISH_TOKEN is missing or empty. Add it in Settings > Secrets and variables > Actions. See docs/releasing.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Stop when the version is not the version of the boilerplate
        run: |
          boilerplate_version="$(tr -d '[:space:]' < boilerplate/VERSION)"
          if [ "${VERSION}" != "${boilerplate_version}" ]; then
            echo "::error::You asked for version ${VERSION}, and boilerplate/VERSION on main says ${boilerplate_version}. Change the version first (docs/releasing.md), or start again with ${boilerplate_version}."
            exit 1
          fi

      - name: Install the packages that the two commands are built with
        run: npm ci --no-audit --no-fund
        working-directory: cli

      # The same three checks as "make check" runs for cli/. The tests also
      # compare boilerplate/VERSION with the newest updates file and with the
      # versions of the two packages. They use no network.
      - name: Lint, test and build the two commands
        run: make lint-cli test-cli build-cli

      # Writes the two .tgz files that npm would publish, and prints the files
      # of each one in the log.
      - name: Pack the two packages
        working-directory: cli
        run: |
          mkdir -p "${RUNNER_TEMP}/packed"
          for name in ${PACKAGES}; do
            npm pack --workspace "${name}" --pack-destination "${RUNNER_TEMP}/packed"
          done
          for tarball in "${RUNNER_TEMP}"/packed/*.tgz; do
            echo "Files of $(basename "${tarball}"):"
            tar -tzf "${tarball}"
          done

      - name: Say what a real run would do
        if: ${{ !inputs.publish }}
        run: |
          echo "The box \"publish\" is off: nothing was published and no tag was created."
          echo "A run with the box on would create the tag v${VERSION} on ${GITHUB_SHA} and publish:"
          for name in ${PACKAGES}; do
            if npm view "${name}@${VERSION}" version > /dev/null 2>&1; then
              echo "  ${name}@${VERSION}: already on npm, it would be skipped"
            else
              echo "  ${name}@${VERSION}"
            fi
          done

      # The tag comes before the packages: a published command downloads the
      # boilerplate at its newest release tag, so the tag must exist first.
      - name: Create the git tag of the release
        if: inputs.publish
        run: |
          existing="$(git ls-remote --tags origin "refs/tags/v${VERSION}" | cut -f1)"
          if [ -z "${existing}" ]; then
            git tag "v${VERSION}" "${GITHUB_SHA}"
            git push origin "refs/tags/v${VERSION}"
            echo "Created the tag v${VERSION} on ${GITHUB_SHA}."
          elif [ "${existing}" = "${GITHUB_SHA}" ]; then
            echo "The tag v${VERSION} already exists on this commit. Kept."
          else
            echo "::error::The tag v${VERSION} already exists on another commit (${existing}). A release is never moved. Raise the version (docs/releasing.md) and start again."
            exit 1
          fi

      - name: Publish the two packages
        if: inputs.publish
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: |
          for name in ${PACKAGES}; do
            if npm view "${name}@${VERSION}" version > /dev/null 2>&1; then
              echo "${name}@${VERSION} is already on npm. Skipped."
              continue
            fi
            npm publish --workspace "${name}" --access public
          done

      - name: Check the result on npm
        if: inputs.publish
        run: |
          for name in ${PACKAGES}; do
            # After a publish, npm needs some minutes before it shows a new
            # version. So ask again every 15 seconds, for up to 10 minutes.
            for attempt in $(seq 1 40); do
              if npm view "${name}@${VERSION}" version > /dev/null 2>&1; then
                break
              fi
              echo "${name}@${VERSION} is not on npm yet (try ${attempt} of 40). Waiting 15 seconds."
              sleep 15
            done
            echo "${name}@${VERSION} on npm:"
            npm view "${name}@${VERSION}" version
            npm view "${name}" dist-tags
          done
