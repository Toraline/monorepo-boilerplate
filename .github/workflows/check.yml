# Runs "make check", then the end-to-end tests ("make e2e"), on every pull
# request to main and on every push to main.
# It uses no repository secret: every value below is the invented sample
# value of .env.example.
name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # The same PostgreSQL image as docker-compose.yml. The tests of the server
      # (apps/api) and the end-to-end tests use it. "make check" and "make e2e"
      # do not start Docker here: the database already answers.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: sample-password-for-local-use
          POSTGRES_DB: todo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo -d todo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Each action is named by the full id of a commit, not by a tag. A tag
      # can be moved to other code; a commit id cannot. The comment after the
      # id is the version. This prints the commit id of a version:
      #   gh api repos/actions/checkout/git/ref/tags/v4.4.0 --jq .object.sha
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # 2 commits: the merge commit of the pull request, and the commit of
          # main that it is merged into. The next step compares them.
          fetch-depth: 2

      # The same check as the pre-commit hook, for everything that the pull
      # request changes. A commit that was made with "git commit --no-verify",
      # or on a machine that never ran "make hooks", did not pass the hook.
      - name: Check the pull request for secrets
        run: CHECK_SECRETS_BASE=HEAD^1 bash scripts/check-secrets.sh

      # "cache: npm" keeps the downloaded packages between runs. The key of the
      # cache is the content of package-lock.json.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt

      # The apps read the database settings from .env. The sample values are
      # the ones the postgres service above uses (127.0.0.1, port 5432).
      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: Install the npm workspace
        run: npm ci --no-audit --no-fund

      # The two npm commands (cli/) have their own lock file. "make check"
      # checks their code style and types, runs their tests and builds them.
      - name: Install the packages of the two npm commands
        run: npm ci --no-audit --no-fund
        working-directory: cli

      # Creates apps/api/.venv and installs the pinned packages of the server.
      - name: Install the server
        run: make install-api

      # Lint, types and tests of the server, of the web apps (apps/web,
      # apps/internal), of packages/shared and of packages/ui, then the production build of the
      # web apps and the build of the catalog (apps/ui-catalog). The tests of the server run against the postgres service above.
      - name: Check
        run: make check

      # The browser of the end-to-end tests (Chromium), with the system
      # packages it needs on this machine. "make e2e" finds it and downloads
      # nothing more.
      - name: Install the browser of the end-to-end tests
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      # The 2 end-to-end tests (e2e/): Playwright starts the server and
      # apps/web with a database of their own on the postgres service above,
      # and opens the web app in the browser. The login of the tests is the
      # first admin of .env.example: invented sample values.
      - name: End-to-end tests
        run: make e2e

      # Kept for 7 days when a step above failed: the report of the run
      # (open index.html) and, for each failed test, a screenshot and a
      # recording of every step. Download it from the page of the run, under
      # "Artifacts".
      - name: Keep the report of the end-to-end tests
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore
